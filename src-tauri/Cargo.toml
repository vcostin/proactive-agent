[package]
name = "proactive-agent"
version = "0.1.0"
edition = "2021"

[lib]
name = "proactive_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# lance-encoding/lance-file use prost-build which requires protoc — vendor it so no system install is needed
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# Pin exactly — the lancedb Rust API has had breaking changes between minor versions.
# Run `cargo tree -i lancedb` and verify arrow-array version matches before updating.
lancedb = "0.14"
# Must match lancedb 0.14's transitive arrow dep (confirmed via `cargo tree -i arrow-array`)
arrow-array = "53"
arrow-schema = "53"
futures = "0.3"

cpal = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"

[package.metadata.bundle]
identifier = "com.proactive.agent"
icon = ["icons/icon.ico"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
